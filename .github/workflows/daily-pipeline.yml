name: Daily SentinelPrior CVE pipeline

on:
  schedule:
    - cron: "45 0 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelprior-daily-pipeline
  cancel-in-progress: false

jobs:
  refresh-current-cves:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: sentinelprior_cve_rag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache local embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: sentinelprior-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run current-day replacement pipeline
        run: python run_pipeline.py
