<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #486581; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #102a43; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #334e68; }
      .small { font: 400 13px Arial, sans-serif; fill: #486581; }
      .arrow { stroke: #486581; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .ai { fill: #e6f6ff; stroke: #0b74b8; stroke-width: 2; }
      .code { fill: #f0fdf4; stroke: #238636; stroke-width: 2; }
      .tool { fill: #fff8e6; stroke: #c77800; stroke-width: 2; }
      .output { fill: #f8f0ff; stroke: #7c3aed; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#486581"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#f8fbff"/>
  <text x="700" y="55" text-anchor="middle" class="title">SentinelPrior Architecture</text>
  <text x="700" y="85" text-anchor="middle" class="subtitle">AI plans and explains; code validates and calculates; public tools provide facts</text>

  <rect x="500" y="120" width="400" height="90" rx="16" class="code"/>
  <text x="700" y="154" text-anchor="middle" class="box-title">User Input</text>
  <text x="700" y="181" text-anchor="middle" class="box-text">Natural-language goal + scanner-style CSV</text>

  <path d="M700 210 L700 250" class="arrow"/>
  <rect x="470" y="250" width="460" height="100" rx="16" class="ai"/>
  <text x="700" y="285" text-anchor="middle" class="box-title">Coordinator + Planner</text>
  <text x="700" y="312" text-anchor="middle" class="box-text">Interpret goal, expose plan, control steps and recovery</text>
  <text x="700" y="334" text-anchor="middle" class="small">OpenAI Structured Outputs or labelled fallback</text>

  <path d="M700 350 L700 390" class="arrow"/>
  <rect x="500" y="390" width="400" height="85" rx="16" class="code"/>
  <text x="700" y="423" text-anchor="middle" class="box-title">CSV Validator</text>
  <text x="700" y="450" text-anchor="middle" class="box-text">Validate rows, CVE format, values and duplicates</text>

  <text x="790" y="507" text-anchor="middle" class="small">Enrichment tools</text>
  <path d="M700 475 L700 530" class="arrow"/>
  <path d="M700 515 L275 515 L275 530" class="arrow"/>
  <path d="M700 515 L1125 515 L1125 530" class="arrow"/>
  <rect x="110" y="530" width="330" height="105" rx="16" class="tool"/>
  <text x="275" y="567" text-anchor="middle" class="box-title">NVD API</text>
  <text x="275" y="594" text-anchor="middle" class="box-text">Description, CVSS, severity</text>
  <text x="275" y="617" text-anchor="middle" class="small">Live public evidence</text>

  <rect x="535" y="530" width="330" height="105" rx="16" class="tool"/>
  <text x="700" y="567" text-anchor="middle" class="box-title">CISA KEV</text>
  <text x="700" y="594" text-anchor="middle" class="box-text">Confirmed exploitation catalog</text>
  <text x="700" y="617" text-anchor="middle" class="small">Live public evidence</text>

  <rect x="960" y="530" width="330" height="105" rx="16" class="tool"/>
  <text x="1125" y="567" text-anchor="middle" class="box-title">FIRST EPSS</text>
  <text x="1125" y="594" text-anchor="middle" class="box-text">Exploitation probability</text>
  <text x="1125" y="617" text-anchor="middle" class="small">Retries + induced failure demo</text>

  <path d="M275 635 C275 680 520 680 600 700" class="arrow"/>
  <path d="M700 635 L700 690" class="arrow"/>
  <path d="M1125 635 C1125 680 880 680 800 700" class="arrow"/>

  <rect x="475" y="690" width="450" height="85" rx="16" class="code"/>
  <text x="700" y="723" text-anchor="middle" class="box-title">Deterministic Risk Engine + QA</text>
  <text x="700" y="750" text-anchor="middle" class="box-text">Priority, score, confidence, reasons, missing-data checks</text>

  <path d="M700 775 L700 810" class="arrow"/>
  <rect x="365" y="810" width="670" height="65" rx="16" class="output"/>
  <text x="700" y="839" text-anchor="middle" class="box-title">Reports and Trace</text>
  <text x="700" y="862" text-anchor="middle" class="box-text">Markdown + JSON + execution log + run transcript</text>
</svg>
